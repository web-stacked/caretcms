name = "caret-demo"
main = "./src/worker.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# CaretCMS on Cloudflare: content lives in a Durable Object, image uploads in R2.
# KV tracks demo upload quotas. Fill in the KV/R2 resources below (see README).

# Public sandbox: every visitor edits in a private, 2h session (no password).
# Requires the Cloudflare adapters (KV + R2). See docs: Demo / Sandbox Mode.
[vars]
CARET_DEMO_MODE = "true"

[[kv_namespaces]]
binding = "CMS_KV"
id = "<your-kv-namespace-id>"

[[durable_objects.bindings]]
name = "CMS_CONTENT"
class_name = "CaretCmsContent"

[exports.CaretCmsContent]
type = "durable-object"
storage = "sqlite"

[[r2_buckets]]
binding = "CMS_R2"
bucket_name = "caret-uploads"
