name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  node-ci:
    name: Node ${{ matrix.node }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Astro 7 requires Node >=22.12.0 (Node 20 is no longer supported).
        node: ["22.12.0", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate pinned versions
        run: npm run validate:versions

      - name: Typecheck core package
        run: npm run typecheck:core

      - name: Build core package
        run: npm run build:core

      - name: Typecheck cloudflare package
        run: npm run typecheck:cloudflare

      - name: Typecheck caretize package
        run: npm run typecheck:caretize

      - name: Typecheck zod package
        run: npm run typecheck:zod

      - name: Build cloudflare package
        run: npm run build:cloudflare

      - name: Build caretize package
        run: npm run build:caretize

      - name: Build zod package
        run: npm run build:zod

      - name: Unit tests
        run: npm run test:unit

      # Build the example apps against the just-built packages so a change to the
      # public API surface that the examples consume (markdownStorage, localUploads,
      # caretLoader, @caretcms/zod, cloudflareStorage/r2Uploads) fails CI here
      # instead of silently later when a user copies an example.
      - name: Build example apps (API drift guard)
        run: npm run build:examples

  # The node-ci job above exercises the pinned Astro 7 (the ^7 half of the core
  # peer range). This job validates the ^6 half — the lower bound — by overriding
  # Astro to the latest 6.x in node_modules only. package.json stays pinned, so
  # validate:versions is intentionally skipped here.
  astro6-compat:
    name: Astro 6 compatibility (lower bound)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install (pinned)
        run: npm ci

      - name: Override Astro to 6.x (not persisted to package.json)
        run: npm install --no-save astro@^6

      - name: Typecheck core against Astro 6
        run: npm run typecheck:core

      - name: Build core against Astro 6
        run: npm run build:core

      - name: Unit tests against Astro 6
        run: npm run test:unit

  playwright-e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Run CSP end-to-end tests (production build + preview)
        run: npm run test:e2e:csp

      - name: Run Markdown publish, rebuild, and restore test
        run: npm run test:e2e:markdown

      - name: Run static delivery publish and build test
        run: npm run test:e2e:static

      - name: Run authorization policy end-to-end tests
        run: npm run test:e2e:permissions

      - name: Run Cloudflare Durable Object concurrency test
        run: npm run test:e2e:cloudflare

  bun-parity:
    name: Bun parity checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.5"

      - name: Install
        run: bun install

      - name: Validate pinned versions
        run: bun run validate:versions

      - name: Build core package
        run: cd packages/core && bun run build
