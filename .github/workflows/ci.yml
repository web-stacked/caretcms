name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  node-ci:
    name: Node ${{ matrix.node }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19.1", "22.12.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate pinned versions
        run: npm run validate:versions

      - name: Typecheck core package
        run: npm run typecheck:core

      - name: Build core package
        run: npm run build:core

      - name: Typecheck cloudflare package
        run: npm run typecheck:cloudflare

      - name: Typecheck caretize package
        run: npm run typecheck:caretize

      - name: Typecheck zod package
        run: npm run typecheck:zod

      - name: Build cloudflare package
        run: npm run build:cloudflare

      - name: Build caretize package
        run: npm run build:caretize

      - name: Build zod package
        run: npm run build:zod

      - name: Unit tests
        run: npm run test:unit

  # The node-ci job above exercises the pinned Astro 6.3.8 (the ^6 half of the
  # peer range). This job validates the ^5 half by overriding Astro to the
  # latest 5.x in node_modules only — package.json stays pinned, so
  # validate:versions is intentionally skipped here.
  astro5-compat:
    name: Astro 5 compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install (pinned)
        run: npm ci

      - name: Override Astro to 5.x (not persisted to package.json)
        run: npm install --no-save astro@^5

      - name: Typecheck core against Astro 5
        run: npm run typecheck:core

      - name: Build core against Astro 5
        run: npm run build:core

      - name: Unit tests against Astro 5
        run: npm run test:unit

  playwright-e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Run CSP end-to-end tests (production build + preview)
        run: npm run test:e2e:csp

  bun-parity:
    name: Bun parity checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.5"

      - name: Install
        run: bun install

      - name: Validate pinned versions
        run: bun run validate:versions

      - name: Build core package
        run: cd packages/core && bun run build
